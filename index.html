<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="书法单字记忆工具 — 间隔重复学习，专为书法爱好者设计" />
    <title>背字帖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 防止页面加载时 FOUC */
      html { visibility: hidden; }
      html.fonts-loaded { visibility: visible; }
    </style>
    <script>
      // GitHub Pages 直接托管仓库根目录，这个 index.html 是 Vite 开发入口（/src/main.tsx 未编译）。
      // 在 Pages 域名下转到同目录的单文件版，避免根路径白屏；线上/本地不受影响。
      (function () {
        if (location.hostname.slice(-10) !== 'github.io') return;
        var base = location.pathname.replace(/[^/]*$/, '');
        location.replace(base + 'beizitie.html');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
