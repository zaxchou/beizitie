<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  /* =========================================================
     背字帖 GitHub Cover（github-cover skill 模板填装，1280×640 @2x）
     ❶ 光晕 ❷ 品牌行 ❸ 标题区 ❹ 3D 窗口 ❺ 浮动小卡 ❻ 点缀
     ========================================================= */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  :root{
    /* ❶ 光晕：宣纸暖调邻近 pastel（蜜桃/朱粉/雾蓝/薄荷/淡金），与朱砂印章呼应 */
    --wash-a:rgba(244,186,150,.40);
    --wash-b:rgba(228,170,160,.28);
    --wash-c:rgba(168,190,240,.26);
    --wash-d:rgba(180,224,190,.28);
    --wash-e:rgba(244,214,150,.30);
    --ink:#1e2530;
    --accent:#a83428;                 /* 朱砂（品牌印章/原拓金框同族） */
  }
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);position:relative;
    background:
      radial-gradient(ellipse at 10% -4%, var(--wash-a), transparent 46%),
      radial-gradient(ellipse at 52% -8%, var(--wash-b), transparent 44%),
      radial-gradient(ellipse at 100% 4%,  var(--wash-c), transparent 42%),
      radial-gradient(ellipse at 100% 100%,var(--wash-d), transparent 44%),
      radial-gradient(ellipse at 0% 104%,  var(--wash-e), transparent 40%),
      linear-gradient(180deg,#fbfbfa 0%,#f6f6f2 100%);
  }
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(40,60,110,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(40,60,110,.05) 1px,transparent 1px);
    background-size:40px 40px}

  /* ❷ 品牌行：朱砂小印 + 产品名 */
  .brand{position:absolute;left:72px;top:54px;display:flex;align-items:center;gap:13px}
  .brand .seal{width:44px;height:44px;border-radius:8px;transform:rotate(-4deg);
    background:linear-gradient(150deg,#c14a3c,#9c2f24);display:grid;grid-template-columns:1fr 1fr;
    place-items:center;padding:4px;box-shadow:0 3px 9px rgba(150,48,31,.32)}
  .brand .seal span{font-family:"KaiTi","STKaiti",serif;font-weight:700;font-size:13px;color:#fdf6ea;line-height:1}
  .brand .name{font-size:21px;font-weight:800;letter-spacing:1px}
  .brand .name i{font-style:normal;color:#9c2f24}

  /* ❸ 标题区 */
  .t1{position:absolute;left:70px;top:126px;font-size:104px;font-weight:800;color:var(--ink);
      letter-spacing:8px;line-height:1;white-space:nowrap}
  .t2{position:absolute;left:74px;top:256px;font-size:62px;line-height:1.15;white-space:nowrap}
  .t2 .serif{font-family:"Songti SC","SimSun",serif;font-weight:700;letter-spacing:6px;
      background:linear-gradient(transparent 58%, rgba(238,214,140,.85) 58%, rgba(238,214,140,.85) 92%, transparent 92%);
      padding:0 6px}
  .t2 .accent{font-family:"Songti SC","SimSun",serif;font-style:italic;color:var(--accent)}
  .sub{position:absolute;left:76px;top:360px;font-size:17px;letter-spacing:2px;color:#5b6472}
  .chips{position:absolute;left:74px;top:406px;display:flex;gap:13px}
  .chip{font-size:15px;padding:7px 17px;border-radius:15px;letter-spacing:1px;
        border:1px solid transparent;font-weight:500;background:rgba(255,255,255,.72)}
  .chip.p{border-color:rgba(180,110,100,.35);color:#9c4034}
  .chip.m{border-color:rgba(90,170,130,.35);color:#2f6e4c}
  .chip.g{border-color:rgba(200,150,60,.38);color:#7a5c18}

  .foot{position:absolute;left:74px;bottom:50px;display:flex;gap:9px;align-items:center}
  .tag{font-size:13px;padding:4px 12px;border-radius:11px;background:var(--ink);color:#f2f4f8;letter-spacing:1px}
  .tag.o{background:rgba(30,37,48,.06);border:1px solid rgba(30,37,48,.15);color:#4a5568}
  .github{position:absolute;left:75px;bottom:16px;font-size:14px;color:#8a92a2;letter-spacing:.5px}
  .github b{color:var(--ink)}

  /* ❹ 3D 透视窗口：在线版市场真实截图（右缘/下缘被画布裁切） */
  .scene{position:absolute;right:-58px;top:104px;width:640px;height:480px;
         perspective:1500px;perspective-origin:30% 40%}
  .win{width:640px;height:430px;border-radius:14px;overflow:hidden;position:relative;
       background:#fff;border:1px solid rgba(255,255,255,.9);
       transform:rotateX(10deg) rotateY(-13deg) rotate(1.5deg);
       box-shadow:-26px 34px 64px rgba(35,40,80,.16), 0 8px 18px rgba(35,40,80,.07)}
  .win .bar{height:30px;background:#f0f2f7;border-bottom:1px solid rgba(30,60,110,.07);
       display:flex;align-items:center;gap:7px;padding:0 14px}
  .win .bar i{width:10px;height:10px;border-radius:50%}
  .win .bar i:nth-child(1){background:#f0908d}.win .bar i:nth-child(2){background:#f2ce7b}.win .bar i:nth-child(3){background:#93d3a0}
  .win .bar s{text-decoration:none;margin-left:10px;font-size:11px;color:#8a92a2;letter-spacing:1px}
  .win img{width:100%;height:calc(100% - 30px);object-fit:cover;object-position:top left;display:block}

  /* ❺ 浮动小卡：SM-2 复习阶梯 */
  .mini{position:absolute;right:428px;top:428px;width:250px;border-radius:12px;
    background:#232a38;color:#e8ecf4;padding:14px 16px;
    transform:rotate(-3deg);
    box-shadow:0 16px 36px rgba(35,40,80,.24), 0 4px 12px rgba(35,40,80,.10);
    font-size:12.5px;letter-spacing:.5px}
  .mini .mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .mini .mt b{font-size:13px;color:#fff}
  .mini .mt span{font-size:10px;color:#8f9ab0;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:1px 7px}
  .mini .row{display:flex;gap:6px;flex-wrap:wrap}
  .mini .z{background:rgba(255,255,255,.10);border-radius:7px;padding:3px 8px}
  .mini .z.on{background:rgba(224,178,95,.32);color:#f0d9a8}

  /* ❻ 点缀 ✦ */
  .spark{position:absolute;left:600px;top:92px;color:#c9917f;font-size:26px;transform:rotate(-8deg)}
  .spark.s2{left:52px;top:470px;font-size:17px;color:#d9b36a}
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="brand">
    <div class="seal"><span>日</span><span>课</span><span>一</span><span>字</span></div>
    <div class="name">背字帖 <i>·</i> Beizitie</div>
  </div>

  <div class="t1">背字帖</div>
  <div class="t2">像<span class="serif">背单词</span>一样<span class="accent">背字</span></div>
  <div class="sub">艾宾浩斯遗忘曲线 · 1431 部碑帖 · 38 万张单字卡 · 免费开源</div>
  <div class="chips">
    <div class="chip p">免费开源</div>
    <div class="chip m">手机电脑可用</div>
    <div class="chip g">集字拼作品</div>
  </div>
  <div class="spark">✦</div>
  <div class="spark s2">✦</div>

  <div class="scene">
    <div class="win">
      <div class="bar"><i></i><i></i><i></i><s>背字帖 · 碑帖市场</s></div>
      <img src="_cover-shot.jpg" alt="">
    </div>
  </div>
  <div class="mini">
    <div class="mt"><b>快忘了？刚好提醒你</b><span>复习</span></div>
    <div class="row">
      <span class="z">刚学完</span><span class="z">10 分钟</span><span class="z">明天</span><span class="z on">4 天后</span>
    </div>
  </div>

  <div class="foot">
    <div class="tag">v1.1.0</div><div class="tag o">MIT 开源</div><div class="tag o">上图 · YGSF</div>
  </div>
  <div class="github">github.com/<b>zaxchou/beizitie</b></div>
</body>
</html>
